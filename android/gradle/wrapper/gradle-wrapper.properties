# NOTE: gradle-wrapper.jar is NOT in this repo — it is a binary and could not be written
# here. Generate it once, from this directory, with a locally installed Gradle:
#
#     gradle wrapper --gradle-version 8.13
#
# or simply open android/ in Android Studio, which offers to create it for you.
# Until then `./gradlew` will not exist. See docs/ANDROID-SETUP.md, step 2.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
