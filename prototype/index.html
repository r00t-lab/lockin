<title>Unsnooze</title>
<style>
  :root {
    --ground: #EFEEE9;
    --surface: #FBFAF7;
    --sunk: #E4E3DC;
    --ink: #17171A;
    --ink-2: #5C5C58;
    --ink-3: #8E8E88;
    --line: #D5D4CC;
    --go: #0F6E56;
    --go-bg: #DCEDE6;
    --alarm: #C7351A;
    --alarm-deep: #4A1409;
    --alarm-pale: #F6D9D2;
    --radius: 14px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121214;
      --surface: #1C1C1F;
      --sunk: #26262A;
      --ink: #EAEAE6;
      --ink-2: #A3A39D;
      --ink-3: #6E6E69;
      --line: #303035;
      --go: #5DCAA5;
      --go-bg: #14332A;
      --alarm: #E85236;
      --alarm-pale: #F6D9D2;
    }
  }
  :root[data-theme="dark"] {
    --ground: #121214;
    --surface: #1C1C1F;
    --sunk: #26262A;
    --ink: #EAEAE6;
    --ink-2: #A3A39D;
    --ink-3: #6E6E69;
    --line: #303035;
    --go: #5DCAA5;
    --go-bg: #14332A;
    --alarm: #E85236;
    --alarm-pale: #F6D9D2;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
  }
  @media (min-width: 700px) {
    body { padding: 28px 0; }
    .app {
      min-height: 760px;
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
    }
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 22px 20px 14px;
  }
  .wordmark {
    font-family: var(--mono);
    font-size: 17px;
    letter-spacing: -0.02em;
    font-weight: 600;
  }
  .wordmark span { color: var(--alarm); }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border-block: 1px solid var(--line);
  }
  .stat { background: var(--ground); padding: 12px 8px; text-align: center; }
  .stat b {
    display: block;
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
  }
  .stat i {
    font-style: normal;
    font-size: 11px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }

  main { flex: 1; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .card .body { flex: 1; min-width: 0; }
  .card .title { font-size: 15px; font-weight: 500; }
  .card .meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-2);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .card.done { background: var(--go-bg); border-color: transparent; }
  .card.done .title { text-decoration: line-through; text-decoration-thickness: 1px; }
  .card.done .title, .card.done .meta, .card.done .flame { color: var(--go); }
  .flame {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .kill {
    border: 0; background: none; color: var(--ink-3);
    font-size: 20px; line-height: 1; cursor: pointer; padding: 4px;
  }
  .kill:hover { color: var(--alarm); }

  .empty {
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 34px 22px;
    text-align: center;
    color: var(--ink-2);
    font-size: 14px;
    line-height: 1.6;
  }

  button {
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    border-radius: 11px;
    transition: transform .08s ease;
  }
  button:active { transform: scale(.985); }
  button:focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }
  .btn-primary {
    background: var(--ink); color: var(--ground);
    border: 0; padding: 15px; width: 100%; font-weight: 500;
  }
  .btn-ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); padding: 13px; width: 100%;
  }
  .btn-add {
    background: transparent; border: 1px solid var(--line); color: var(--ink);
    width: 34px; height: 34px; border-radius: 50%; font-size: 20px;
    display: grid; place-items: center; padding: 0;
  }

  .rail { padding: 0 20px 26px; display: flex; flex-direction: column; gap: 9px; }
  .note {
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink-3);
    text-align: center;
  }

  /* overlays */
  .sheet {
    position: fixed; inset: 0; z-index: 40;
    background: var(--ground);
    display: flex; flex-direction: column;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    max-width: 430px; margin: 0 auto;
    overflow-y: auto;
  }
  .sheet h2 { font-size: 20px; font-weight: 500; margin: 0 0 20px; }
  label {
    display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.09em; color: var(--ink-3); margin: 16px 0 7px;
  }
  input[type="text"], input[type="time"], select {
    width: 100%; padding: 13px 14px; font-size: 16px;
    font-family: inherit; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 11px;
  }
  input[type="time"] { font-family: var(--mono); }
  input:focus, select:focus { outline: 2px solid var(--go); outline-offset: -1px; }

  /* alarm */
  .alarm {
    position: fixed; inset: 0; z-index: 60;
    background: var(--alarm);
    color: var(--alarm-pale);
    display: flex; flex-direction: column;
    padding: 40px 24px calc(28px + env(safe-area-inset-bottom));
    max-width: 430px; margin: 0 auto;
    animation: pulse 1.15s ease-in-out infinite;
  }
  @keyframes pulse { 50% { background: #A82912; } }
  @media (prefers-reduced-motion: reduce) { .alarm { animation: none; } }
  .alarm .eyebrow {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .alarm h1 {
    font-size: clamp(30px, 9vw, 40px); font-weight: 500;
    line-height: 1.12; margin: 14px 0 0; color: #fff;
    text-wrap: balance;
  }
  .alarm .clock {
    font-family: var(--mono); font-size: 14px; margin-top: 12px;
    font-variant-numeric: tabular-nums;
  }
  .alarm .spacer { flex: 1; }
  .btn-prove {
    background: #fff; color: var(--alarm-deep);
    border: 0; padding: 17px; width: 100%; font-weight: 600; font-size: 16px;
  }
  .btn-dismiss {
    background: transparent; color: var(--alarm-pale);
    border: 1px solid rgba(255,255,255,.42); padding: 15px; width: 100%;
    margin-top: 10px;
  }

  /* proof */
  .shot {
    background: var(--sunk); border-radius: var(--radius);
    height: 190px; display: grid; place-items: center;
    color: var(--ink-3); font-size: 13px; text-align: center;
    overflow: hidden; margin-top: 18px;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; }
  .countdown {
    font-family: var(--mono); font-size: 58px; font-weight: 600;
    text-align: center; margin: 34px 0 8px; letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  .err { color: var(--alarm); font-size: 13px; text-align: center; margin-top: 12px; }
  .bail {
    background: none; border: 0; color: var(--ink-3);
    font-size: 13px; width: 100%; padding: 14px; margin-top: 6px;
  }
  .hide { display: none !important; }
</style>

<div class="app">
  <header>
    <div class="wordmark">un<span>snooze</span></div>
    <button class="btn-add" id="add" aria-label="Yeni taahhüt">+</button>
  </header>

  <div class="stats">
    <div class="stat"><b id="s-streak">0</b><i>streak</i></div>
    <div class="stat"><b id="s-done">0</b><i>bugün</i></div>
    <div class="stat"><b id="s-miss">0</b><i>bahane</i></div>
  </div>

  <main id="list"></main>

  <div class="rail">
    <button class="btn-primary" id="fire">10 saniye sonra alarmı çal</button>
    <p class="note">Bu bir tarayıcı prototipi. Gerçek uygulama sessiz modu ve Focus'u
      deler — web bunu yapamaz, o kısım AlarmKit'te. Geri kalan akış birebir aynı.</p>
  </div>
</div>

<div class="sheet hide" id="sheet">
  <h2>Yeni taahhüt</h2>
  <label for="f-title">Neye başlayacaksın</label>
  <input type="text" id="f-title" placeholder="Bitirme ödevinin girişini yaz" autocomplete="off">
  <label for="f-time">Saat</label>
  <input type="time" id="f-time" value="19:00">
  <label for="f-proof">Nasıl kanıtlayacaksın</label>
  <select id="f-proof">
    <option value="photo">Masanın fotoğrafı</option>
    <option value="timer">25 dakikalık sayacı başlat</option>
  </select>
  <p class="err hide" id="f-err">Önce ne yapacağını yaz.</p>
  <div style="flex:1"></div>
  <button class="btn-primary" id="save" style="margin-top:22px">Kilitle</button>
  <button class="btn-ghost" id="cancel" style="margin-top:9px">Vazgeç</button>
</div>

<div class="alarm hide" id="alarm">
  <div class="eyebrow" id="a-eyebrow">Başlayacağını söyledin</div>
  <h1 id="a-title"></h1>
  <div class="clock" id="a-clock"></div>
  <div class="spacer"></div>
  <button class="btn-prove" id="a-prove">Başlıyorum</button>
  <button class="btn-dismiss" id="a-dismiss">Kapat</button>
</div>

<div class="sheet hide" id="proof">
  <h2 id="p-title"></h2>
  <div id="p-photo">
    <div class="shot" id="p-shot">masanı ya da açık ekranı çek</div>
    <input type="file" accept="image/*" capture="environment" id="p-file" class="hide">
    <button class="btn-primary" id="p-snap" style="margin-top:16px">Fotoğrafı çek</button>
  </div>
  <div id="p-timer" class="hide">
    <div class="countdown" id="p-count">25:00</div>
    <button class="btn-primary" id="p-start">25 dakikayı başlat</button>
  </div>
  <div style="flex:1"></div>
  <button class="bail" id="p-bail">Yapmıyorum</button>
</div>

<script>
const NAG_SECONDS = 30;
const MAX_NAGS = 5;
const $ = id => document.getElementById(id);

let state = load();
let timerId = null, nagId = null, active = null, nagCount = 0, audio = null, tick = null;

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem("lockin") || "null");
    if (raw && Array.isArray(raw.items)) return raw;
  } catch (e) {}
  return {
    items: [
      { id: 1, title: "Bitirme ödevinin girişini yaz", time: "19:00", proof: "photo", streak: 0, doneOn: null },
      { id: 2, title: "Derse çıkmak için evden çık", time: "08:20", proof: "timer", streak: 0, doneOn: null }
    ],
    misses: 0
  };
}
function save() { localStorage.setItem("lockin", JSON.stringify(state)); }
function today() { return new Date().toDateString(); }

function render() {
  const list = $("list");
  list.innerHTML = "";
  if (!state.items.length) {
    list.innerHTML = '<div class="empty">Seni tutan hiçbir şey yok.<br>Sürekli ertelediğin şeyi ekle.</div>';
  }
  for (const it of state.items) {
    const done = it.doneOn === today();
    const el = document.createElement("div");
    el.className = "card" + (done ? " done" : "");
    el.innerHTML =
      '<div class="body"><div class="title"></div><div class="meta"></div></div>' +
      (it.streak ? '<span class="flame">' + it.streak + '</span>' : '') +
      '<button class="kill" aria-label="Sil">&times;</button>';
    el.querySelector(".title").textContent = it.title;
    el.querySelector(".meta").textContent =
      it.time + "  ·  " + (it.proof === "photo" ? "fotoğraf" : "sayaç");
    el.querySelector(".kill").onclick = () => {
      state.items = state.items.filter(x => x.id !== it.id);
      save(); render();
    };
    list.appendChild(el);
  }
  $("s-streak").textContent = state.items.reduce((m, i) => Math.max(m, i.streak), 0);
  $("s-done").textContent = state.items.filter(i => i.doneOn === today()).length;
  $("s-miss").textContent = state.misses;
}

/* ---- alarm sound: synthesised, no external files ---- */
function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime;
    for (let i = 0; i < 2; i++) {
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(i ? 660 : 880, t + i * 0.22);
      gain.gain.setValueAtTime(0.0001, t + i * 0.22);
      gain.gain.exponentialRampToValueAtTime(0.16, t + i * 0.22 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.22 + 0.19);
      osc.connect(gain).connect(audio.destination);
      osc.start(t + i * 0.22); osc.stop(t + i * 0.22 + 0.2);
    }
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([320, 130, 320]);
}

function ring(item, isNag) {
  active = item;
  $("a-eyebrow").textContent = isNag ? "Hâlâ başlamadın" : "Başlayacağını söyledin";
  $("a-title").textContent = item.title;
  $("a-clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) +
    (isNag ? "   ·   " + MAX_NAGS + " denemeden " + nagCount + ".'si" : "");
  $("a-dismiss").textContent = isNag ? "Hâlâ başlamadım" : "Kapat";
  $("alarm").classList.remove("hide");
  beep();
  clearInterval(tick);
  tick = setInterval(beep, 2600);
}

function silence() {
  clearInterval(tick); tick = null;
  $("alarm").classList.add("hide");
}

function scheduleNag() {
  if (nagCount >= MAX_NAGS) { nagCount = 0; return; }
  nagCount++;
  const it = active;
  nagId = setTimeout(() => ring(it, true), NAG_SECONDS * 1000);
}

/* ---- proof ---- */
function openProof() {
  silence();
  const isPhoto = active.proof === "photo";
  $("p-title").textContent = active.title;
  $("p-photo").classList.toggle("hide", !isPhoto);
  $("p-timer").classList.toggle("hide", isPhoto);
  $("p-shot").textContent = "masanı ya da açık ekranı çek";
  $("p-file").value = "";
  clearInterval(focusIv);
  $("p-count").textContent = "25:00";
  $("p-start").disabled = false;
  $("p-start").textContent = "25 dakikayı başlat";
  $("proof").classList.remove("hide");
}

function accept() {
  const it = state.items.find(x => x.id === active.id);
  if (it) {
    if (it.doneOn !== today()) it.streak++;
    it.doneOn = today();
  }
  clearTimeout(nagId); nagCount = 0;
  save(); render();
  $("proof").classList.add("hide");
}

$("p-snap").onclick = () => $("p-file").click();
$("p-file").onchange = e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  clearInterval(focusIv);
  const img = new Image();
  img.src = URL.createObjectURL(file);
  img.alt = "";
  $("p-shot").textContent = "";
  $("p-shot").appendChild(img);
  setTimeout(accept, 700);
};

let focusIv = null;
$("p-start").onclick = () => {
  let left = 25 * 60;
  $("p-start").disabled = true;
  $("p-start").textContent = "Çalışıyor";
  clearInterval(focusIv);
  focusIv = setInterval(() => {
    left--;
    $("p-count").textContent =
      String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
    if (left <= 0) clearInterval(focusIv);
  }, 1000);
  // Başlamak kanıttır. Bitirmek onunla diploması arasında.
  accept();
};

$("p-bail").onclick = () => {
  state.misses++;
  const it = state.items.find(x => x.id === active.id);
  if (it) it.streak = 0;
  save(); render();
  $("proof").classList.add("hide");
  scheduleNag();
};

/* ---- wiring ---- */
$("a-prove").onclick = openProof;
$("a-dismiss").onclick = () => {
  state.misses++;
  const it = state.items.find(x => x.id === active.id);
  if (it) it.streak = 0;
  save(); render();
  silence();
  scheduleNag();
};

$("fire").onclick = () => {
  if (!state.items.length) return;
  beep();
  nagCount = 0;
  const it = state.items.find(x => x.doneOn !== today()) || state.items[0];
  $("fire").textContent = "10…";
  let n = 10;
  clearInterval(timerId);
  timerId = setInterval(() => {
    n--;
    $("fire").textContent = n > 0 ? n + "…" : "10 saniye sonra alarmı çal";
    if (n <= 0) { clearInterval(timerId); ring(it, false); }
  }, 1000);
};

$("add").onclick = () => {
  $("f-title").value = "";
  $("f-err").classList.add("hide");
  $("sheet").classList.remove("hide");
  $("f-title").focus();
};
$("cancel").onclick = () => $("sheet").classList.add("hide");
$("f-title").oninput = () => $("f-err").classList.add("hide");
$("save").onclick = () => {
  const title = $("f-title").value.trim();
  if (!title) { $("f-err").classList.remove("hide"); $("f-title").focus(); return; }
  state.items.push({
    id: Date.now(), title, time: $("f-time").value,
    proof: $("f-proof").value, streak: 0, doneOn: null
  });
  save(); render();
  $("sheet").classList.add("hide");
};

render();
</script>
