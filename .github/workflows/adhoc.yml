name: Ad hoc IPA

# Produces a signed IPA that installs straight onto a registered device over USB, with
# no TestFlight in the path. That is the whole point: TestFlight on the target phone
# fails with keychain error -34018 and cannot authenticate a download, so the build is
# fine and the delivery channel is not.
#
# Install the artifact with 3uTools on Windows: Apps -> Install -> pick the .ipa.
on:
  push:
    tags: ["ipa-*"]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Lockin.xcodeproj
        run: xcodegen generate --spec project.yml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: bundle install

      # Apple caps how many certificates an account may hold, and every run here mints a
      # development certificate that dies with the runner. Left alone the ceiling fills
      # and every build breaks with an error that talks about provisioning profiles. This
      # step is the reason that does not happen again; it never fails the job.
      - name: Prune stale CI certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 .github/scripts/prune_certificates.py

      - name: Build ad-hoc IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -o pipefail
          bundle exec fastlane adhoc 2>&1 | tee adhoc.log

      # Keep this step free of quoting tricks. The previous version put an apostrophe
      # inside a double-quoted grep pattern, which broke the shell and made the step
      # itself exit 2 — hiding the very error it existed to report.
      #
      # Search the whole log: a window at the end never reaches the diagnostic, because
      # everything fastlane prints after a failure is longer than the window. GitHub
      # keeps only the first ten annotations, so emit few.
      - name: Errors only
        if: failure()
        run: |
          echo "----- last 200 lines -----"
          tail -n 200 adhoc.log || true

          cat adhoc.log ~/Library/Logs/gym/*.log 2>/dev/null > /tmp/all.log || true
          perl -pe 's/\e\[[0-9;]*[mK]//g' /tmp/all.log > /tmp/clean.log || true

          grep -aE "error:|No signing certificate|No profiles for|Provisioning profile|requires a provisioning|No account for team|Code Signing Error" /tmp/clean.log \
            | grep -avE "^[[:space:]]*(builtin-|/usr/bin/|cd |export |ProcessProductPackaging|CodeSign )" \
            | awk '!seen[$0]++' | tail -n 6 > /tmp/errs.txt || true

          if [ ! -s /tmp/errs.txt ]; then
            grep -aF "[!]" /tmp/clean.log | awk '!seen[$0]++' | tail -n 3 > /tmp/errs.txt || true
          fi

          while IFS= read -r line; do echo "::error::${line}"; done < /tmp/errs.txt
          exit 0

      - name: Publish the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nagg-ipa
          path: "*.ipa"
          if-no-files-found: error
          retention-days: 14
