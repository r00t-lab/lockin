name: Ad hoc IPA

# Produces a signed IPA you can install straight onto a registered device, with no
# TestFlight involved. That is the point: TestFlight on the target phone is failing
# with keychain error -34018 and cannot authenticate a download, so the build is fine
# and the delivery channel is not. This routes around it.
#
# Install the artifact with 3uTools on Windows (Apps -> Install -> pick the .ipa).
# The device UDID must be registered in the Apple Developer portal first, otherwise
# the ad-hoc profile will not include it and the install is refused.
on:
  push:
    tags: ["ipa-*"]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Lockin.xcodeproj
        run: xcodegen generate --spec project.yml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: bundle install

      - name: Build ad-hoc IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -o pipefail
          bundle exec fastlane adhoc 2>&1 | tee adhoc.log

      # Look for compiler/exporter diagnostics across the WHOLE log first. Taking a
      # window before fastlane's "finished with errors" line does not reach far enough:
      # fastlane echoes the Fastfile and prints its summary table after the failure, so
      # sixty lines of context are all epilogue. GitHub also keeps only the first ten
      # annotations, so emit few and emit the right ones.
      - name: Errors only
        if: failure()
        run: |
          echo "───────── last 200 lines ─────────"
          tail -n 200 adhoc.log

          strip() { perl -pe 's/\e\[[0-9;]*[mK]//g' | grep -v '^[[:space:]]*$' | awk '!seen[$0]++'; }

          cat adhoc.log ~/Library/Logs/gym/*.log 2>/dev/null             | grep -aE "(^|[[:space:]])error:|No signing certificate|No profiles for|doesn'"'"'t include|Provisioning profile|requires a provisioning|No account for team|no valid"             | grep -avE "^[[:space:]]*(builtin-|/usr/bin/|cd |export |ProcessProductPackaging|CodeSign )"             | strip | tail -n 6 > /tmp/errs.txt

          if [ ! -s /tmp/errs.txt ]; then
            grep -a "\[!\]" adhoc.log | strip | tail -n 3 > /tmp/errs.txt
          fi

          while IFS= read -r line; do echo "::error::${line}"; done < /tmp/errs.txt

      - name: Publish the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nagg-ipa
          path: "*.ipa"
          if-no-files-found: error
          retention-days: 14
