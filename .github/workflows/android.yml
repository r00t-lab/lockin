name: Android

# Android builds on Linux, which costs a tenth of a macOS minute. Run it on every push
# without thinking about the bill.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "gradle/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # gradle-version is required, not optional. Without it setup-gradle only caches
      # and expects ./gradlew to exist — and the wrapper jar is a binary that could not
      # be authored on Windows, so it is not in the repo. Pinning here supplies the
      # `gradle` binary directly. Keep this in sync with gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # `gradle`, not `./gradlew`. The wrapper jar is a binary that cannot be authored
      # on Windows and is not in the repo; setup-gradle supplies Gradle itself. If you
      # ever generate the wrapper locally, switch these three commands back to ./gradlew.
      - name: Compile check
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # Same trick as the iOS job: raw logs need a signed-in session, but the
      # annotations API is public. Re-emit the Kotlin diagnostics as annotations so a
      # failure can be read without anyone copying it out of a browser.
      - name: Errors only
        if: failure()
        run: |
          echo "───────── errors ─────────"
          grep -E "^e: |error:|FAILURE:|What went wrong|Could not |Unresolved reference|Caused by:" build.log \
            | sort -u | head -40 | tee /tmp/errs.txt
          while IFS= read -r line; do echo "::error::${line}"; done < /tmp/errs.txt

      - name: Decode upload keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload.jks

      - name: Build release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload to Play closed testing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Must match applicationId in android/app/build.gradle.kts exactly.
          packageName: app.lockin
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          # Stays on the closed track until the 12-tester / 14-day requirement clears.
          # See docs/ANDROID.md — promoting early is not possible, not just unwise.
          track: internal
          status: completed

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockin-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
