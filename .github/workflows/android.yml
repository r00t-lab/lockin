name: Android

# Android builds on Linux, which costs a tenth of a macOS minute. Run it on every push
# without thinking about the bill.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "gradle/**"
      - ".github/workflows/android.yml"
    # apk-* publishes the debug build as a release asset the testers can download
    # without a GitHub account. v* is the signed Play upload; the two are different
    # tags on purpose, because handing twelve people a link is not shipping.
    # apk-*  tester APK, public download link
    # play-* Android store upload on its own, without minting an iOS build
    # v*     both stores, for the same-day launch
    tags: ["apk-*", "play-*", "v*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `secrets` is not a valid context inside `if:` -- a workflow that tries it fails to
      # parse, produces a run with no jobs at all, and reports a failure that names
      # nothing. Job-level env can read secrets, and `if` can read env.
      HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # gradle-version is required, not optional. Without it setup-gradle only caches
      # and expects ./gradlew to exist — and the wrapper jar is a binary that could not
      # be authored on Windows, so it is not in the repo. Pinning here supplies the
      # `gradle` binary directly. Keep this in sync with gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # `gradle`, not `./gradlew`. The wrapper jar is a binary that cannot be authored
      # on Windows and is not in the repo; setup-gradle supplies Gradle itself. If you
      # ever generate the wrapper locally, switch these three commands back to ./gradlew.
      - name: Compile check
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # Same trick as the iOS job: raw logs need a signed-in session, but the
      # annotations API is public. Re-emit the Kotlin diagnostics as annotations so a
      # failure can be read without anyone copying it out of a browser.
      - name: Errors only
        if: failure()
        run: |
          echo "───────── errors ─────────"
          grep -E "^e: |error:|FAILURE:|What went wrong|Could not |Unresolved reference|Caused by:" build.log \
            | sort -u | head -40 | tee /tmp/errs.txt || true
          # A failure matching none of those patterns used to vanish entirely.
          # An ugly log beats a log nobody can read.
          echo "───────── last lines ─────────"
          tail -40 build.log | tee -a /tmp/errs.txt
          while IFS= read -r line; do echo "::error::${line}"; done < /tmp/errs.txt

      - name: Decode upload keystore
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/play-')
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload.jks

      - name: Build release bundle
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/play-')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Monotonic and free, same as the iOS build number. Play rejects a repeat.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          # Tee, like the debug build does. Without it a release failure produced
          # an "exit code 1" annotation and nothing else -- the log the next step
          # greps was still the one from assembleDebug, which had succeeded.
          gradle bundleRelease --stacktrace 2>&1 | tee -a build.log
          # An unsigned bundle uploads fine and is rejected on the far side with a message
          # about the certificate, hours later. Catch it here instead.
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q "META-INF/.*\.RSA\|META-INF/.*\.EC"             || { echo "::error::release bundle is not signed -- check the keystore secrets"; exit 1; }

      # Skipped rather than failed when the service account is not set up yet, so a tag
      # pushed to check the signing half does not come back red for the half that was
      # never claimed to be ready.
      - name: Upload to Play closed testing
        if: |
          (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/play-'))
          && env.HAS_PLAY_JSON == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Must match applicationId in android/app/build.gradle.kts exactly.
          packageName: com.r00tlab.nagg
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          # Stays on the closed track until the 12-tester / 14-day requirement clears.
          # See docs/ANDROID.md — promoting early is not possible, not just unwise.
          track: internal
          status: completed

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockin-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      # A download link that works for someone who has never seen GitHub. Artifacts
      # require a logged-in session, which is fine for the developer and useless for a
      # test group -- and a test group that cannot install the build is not a test group.
      - name: Publish the APK where testers can reach it
        if: startsWith(github.ref, 'refs/tags/apk-')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          name: "Nagg test build ${{ github.ref_name }}"
          body: |
            Debug build for testing. Not the Play build.

            Install: allow "install unknown apps" for your browser or file manager, then
            open the APK. It installs alongside a Play copy rather than replacing it.

            Start with **Rehearse the alarm** at the bottom of the list: it rings in 20
            seconds and nags every 30, so the whole mechanic plays out in three minutes.
            Put the phone down and prove nothing -- that is the part worth watching.

            The paywall is empty on purpose; subscriptions are not wired up yet.
          prerelease: true
