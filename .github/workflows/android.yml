name: Android

# Android builds on Linux, which costs a tenth of a macOS minute. Run it on every push
# without thinking about the bill.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # `gradle`, not `./gradlew`. The wrapper jar is a binary that cannot be authored
      # on Windows and is not in the repo; setup-gradle supplies Gradle itself. If you
      # ever generate the wrapper locally, switch these three commands back to ./gradlew.
      - name: Compile check
        run: gradle assembleDebug --stacktrace

      - name: Decode upload keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload.jks

      - name: Build release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload to Play closed testing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Must match applicationId in android/app/build.gradle.kts exactly.
          packageName: app.lockin
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          # Stays on the closed track until the 12-tester / 14-day requirement clears.
          # See docs/ANDROID.md — promoting early is not possible, not just unwise.
          track: internal
          status: completed

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockin-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
