name: Release

# Tags only. This is deliberately a separate file from ios.yml: a tag is not a branch,
# so `on.push.branches` never matches one, and bolting a tag filter onto a workflow that
# also has a `paths` filter is a reliable way to get a job that silently never runs.
#
# ios.yml answers "does it compile" on every push. This answers "ship it", and nothing
# else triggers it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Lockin.xcodeproj
        run: xcodegen generate --spec project.yml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: bundle install

      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -o pipefail
          bundle exec fastlane beta 2>&1 | tee release.log

      # Same public-annotations trick as the other workflows: signing failures are the
      # hardest to read from outside, and this is the step most likely to fail first.
      # Grepping for known error shapes was the wrong instinct here — fastlane's failure
      # vocabulary is nothing like a compiler's, and a pattern that misses leaves the
      # run unreadable from outside. The tail is short whenever this step fails early,
      # so just publish it.
      # GitHub renders at most 10 annotations per step, and it keeps the FIRST ten. A
      # naive tail therefore publishes fastlane's startup banner and drops the actual
      # error. Send few lines, chosen: fastlane marks errors with [!], and whatever
      # killed the run is in the last handful. Strip ANSI colour too — the escape
      # sequences survive into the annotation and make it unreadable.
      - name: Errors only
        if: failure()
        run: |
          echo "───────── last 120 lines ─────────"
          tail -n 120 release.log

          # "Error building the application - see the log above" is all fastlane says;
          # the real diagnostic is xcodebuild's, and gym also writes its own fuller log
          # elsewhere. Search both, and prefer signing and compiler lines over
          # fastlane's summary table — the last matches are the ones that killed it.
          # Two things that bit earlier attempts, both worth stating:
          #  - `sort -u` reorders alphabetically, so `head` afterwards keeps whichever
          #    line happens to sort first, not the one that failed. Dedupe with awk
          #    instead, which preserves order.
          #  - xcodebuild echoes every command it runs (codesign, builtin-*,
          #    ProcessProductPackaging). Those match any keyword grep and crowd out the
          #    one diagnostic line, so they are filtered out explicitly.
          cat release.log ~/Library/Logs/gym/*.log 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -aE "error:|doesn't include|No profiles for|No signing certificate|Provisioning profile|requires a provisioning|Failed to register|not supported|is not valid|ITMS-|Asset validation|delivery service|Invalid |missing|\[!\]" \
            | grep -avE "^[[:space:]]*(builtin-|/usr/bin/|cd |export |ProcessProductPackaging|CodeSign )" \
            | awk '!seen[$0]++' \
            | grep -v '^[[:space:]]*$' \
            | tail -n 9 > /tmp/errs.txt
          while IFS= read -r line; do echo "::error::${line}"; done < /tmp/errs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            release.log
            ~/Library/Logs/gym
          if-no-files-found: ignore
