name: Release

# Tags only. This is deliberately a separate file from ios.yml: a tag is not a branch,
# so `on.push.branches` never matches one, and bolting a tag filter onto a workflow that
# also has a `paths` filter is a reliable way to get a job that silently never runs.
#
# ios.yml answers "does it compile" on every push. This answers "ship it", and nothing
# else triggers it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Lockin.xcodeproj
        run: xcodegen generate --spec project.yml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # Apple caps how many certificates an account may hold, and every run here mints a
      # development certificate that dies with the runner. Left alone the ceiling fills
      # and every build breaks with an error that talks about provisioning profiles. This
      # step is the reason that does not happen again; it never fails the job.
      - name: Prune stale CI certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 .github/scripts/prune_certificates.py

      - name: Install fastlane
        run: bundle install

      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -o pipefail
          bundle exec fastlane beta 2>&1 | tee release.log

      # Publish why Apple said no, in a form readable without a GitHub session.
      #
      # Anchoring on fastlane's own markers does not work: it prints its summary table
      # BEFORE the error, so any window ending at a [!] is just table. altool is the
      # only thing here that knows the actual reason, and it prefixes every line it
      # writes — so go straight to that.
      - name: Errors only
        if: failure()
        run: |
          echo "───────── last 150 lines ─────────"
          tail -n 150 release.log

          strip() { perl -pe 's/\e\[[0-9;]*[mK]//g' | grep -v '^[[:space:]]*$' | awk '!seen[$0]++'; }

          grep -a "\[altool\]" release.log | strip | tail -n 9 > /tmp/errs.txt

          if [ ! -s /tmp/errs.txt ]; then
            n=$(grep -an "fastlane finished with errors" release.log | head -1 | cut -d: -f1)
            if [ -n "$n" ] && [ "$n" -gt 1 ]; then
              start=$(( n > 60 ? n - 60 : 1 ))
              sed -n "${start},${n}p" release.log                 | grep -avE "^[[:space:]]*(builtin-|/usr/bin/|cd |export |ProcessProductPackaging|CodeSign )"                 | strip | tail -n 9 > /tmp/errs.txt
            else
              tail -n 9 release.log | strip > /tmp/errs.txt
            fi
          fi

          while IFS= read -r line; do echo "::error::${line}"; done < /tmp/errs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            release.log
            ~/Library/Logs/gym
          if-no-files-found: ignore
