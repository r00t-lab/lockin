name: iOS

# Two triggers on purpose:
#   push  → cheap compile check, catches the AlarmKit signature drift in ~6 minutes
#   tag   → full archive + TestFlight, so shipping is deliberate and never accidental
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "project.yml"
      - "fastlane/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 went GA in Feb 2026 and is the only image with Xcode 26, which is the
    # only Xcode with AlarmKit. Do not downgrade this to macos-latest.
    runs-on: macos-26
    timeout-minutes: 40

    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Lockin.xcodeproj
        run: xcodegen generate --spec project.yml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Compile check
        run: bundle exec fastlane check

      - name: Ship to TestFlight
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane beta

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            fastlane/report.xml
          if-no-files-found: ignore
