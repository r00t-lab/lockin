name: iOS

# Two triggers on purpose:
#   push  → cheap compile check, catches AlarmKit signature drift
#   tag   → full archive + TestFlight, so shipping is deliberate and never accidental
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "project.yml"
      - "fastlane/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 went GA in Feb 2026 and is the only image with Xcode 26, which is the
    # only Xcode with AlarmKit. Do not downgrade this to macos-latest.
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Never hardcode an Xcode path. The runner ships point releases
      # (Xcode_26.1.app, Xcode_26.6.app…) and a missing exact path kills the job in
      # seconds with an error that looks nothing like a build failure. Pick the newest
      # 26.x if one exists, otherwise trust the image default — and print the list
      # either way so the log tells us what is actually installed.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Lockin.xcodeproj
        run: xcodegen generate --spec project.yml

      # Raw xcodebuild, no Ruby, no fastlane. This step exists to answer one question —
      # does the Swift compile? — so it holds nothing that can fail for another reason.
      - name: Compile check
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lockin.xcodeproj \
            -scheme Lockin \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log

      # Re-emit each compiler error as a GitHub annotation.
      #
      # Not cosmetics: raw job logs need a signed-in session to read, but the
      # annotations API is public on a public repo. Echoing ::error:: puts the Swift
      # diagnostics somewhere they can be fetched without anyone copying them out of
      # a browser by hand. Worth the four lines every single build.
      - name: Errors only
        if: failure()
        run: |
          echo "───────── errors ─────────"
          grep -E "error:|fatal error:" build.log | sort -u | head -40 | tee /tmp/errs.txt
          while IFS= read -r line; do echo "::error::${line}"; done < /tmp/errs.txt
          echo "───────── warnings ─────────"
          grep -E "warning:" build.log | sort -u | head -15 || true

      # Ruby only enters on a tag, where signing and upload genuinely need fastlane.
      - uses: ruby/setup-ruby@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        if: startsWith(github.ref, 'refs/tags/v')
        run: bundle install

      - name: Ship to TestFlight
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane beta

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build
          if-no-files-found: ignore
