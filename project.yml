# XcodeGen spec — the whole Xcode project, as text.
#
# Why this file exists: you do not own a Mac. An .xcodeproj is a fragile binary-ish
# bundle that has to be authored in Xcode. This YAML replaces it. You edit it on
# Windows, commit, and the macOS runner runs `xcodegen generate` to produce a real
# .xcodeproj before building. Never commit the generated .xcodeproj.
#
# Team ID is hardcoded rather than read from a secret. It is not sensitive — it ships
# inside every IPA — and hardcoding removes one more thing that can be silently missing
# when a build fails on a machine you cannot see.

name: Lockin

options:
  bundleIdPrefix: com.r00tlab
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: VFYZFK5NL3
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # iPhone and iPad. LAUNCH.md argues for phone-only and the reasoning still holds --
    # iPad costs its own screenshots, its own review surface and its own testing -- but
    # the app was already being reviewed on an iPad Air (it is in three rejection
    # notices), and in compatibility mode it renders as a phone-sized window in the
    # middle of a 13" display. Shipping iPad properly is the smaller of the two costs.
    TARGETED_DEVICE_FAMILY: "1,2"
  # No `configs:` block pinning CODE_SIGN_IDENTITY here, and this is load-bearing.
  #
  # Setting it alongside CODE_SIGN_STYLE: Automatic is rejected outright — "LockinWidget
  # has conflicting provisioning settings ... a conflicting code signing identity Apple
  # Distribution has been manually specified". Automatic signing owns the identity.
  #
  # And the thing it was meant to fix was a misreading. Xcode signs the *archive* for
  # development and `exportArchive` re-signs it ad-hoc afterwards, so a development
  # certificate is genuinely required. Creating one is not the bug. Creating a brand new
  # one on every single run is, because the runner is destroyed with the private key
  # inside it, and ten dead certificates later the account hits Apple's ceiling and every
  # build fails with an error that talks about provisioning profiles. The fix belongs in
  # the workflow, which now prunes them — see .github/workflows/adhoc.yml.

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:

  # The watch targets were pulled from v1 after builds 17 and 18 uploaded, validated,
  # showed as Testing, and refused to install. They are back, with what that note asked
  # for: a cause rather than another guess.
  #
  # The complication had no `info:` block, so its NSExtension dictionary was never
  # written. INFOPLIST_KEY_* can only set flat top-level keys -- the same trap the phone
  # widget documents below, where it costs upload error 90348. On watchOS it costs the
  # install instead: the bundle is malformed, Apple's upload validation does not look
  # that deep, and the device refuses the whole app. That is the symptom 17 and 18 had.

  # ── iPhone app ───────────────────────────────────────────────────────────────
  Lockin:
    type: application
    platform: iOS
    sources:
      - path: ios/Lockin
    dependencies:
      - target: LockinWidget
        embed: true
      # LockinWatch is defined below but deliberately not embedded. An app that ships a
      # watchOS app cannot be submitted without Apple Watch screenshots, and those cannot
      # be produced without a Watch or a Mac — neither of which exists here. Embedding it
      # does not risk a rejection; it makes the version unsubmittable, which held a live
      # bug fix hostage to a feature that has never shipped. Re-add these two lines the
      # day the screenshots exist.
      - package: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r00tlab.lockin
        # Internal target/bundle names stay "Lockin" — the App Store name was taken and
        # renaming internals would invalidate the registered identifiers for nothing.
        # Only CFBundleDisplayName reaches the user's home screen.
        PRODUCT_NAME: Lockin
        TARGETED_DEVICE_FAMILY: "1,2"
        # Placeholder icon; replace the 1024px PNG before the store listing goes live.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # A real Info.plist, not GENERATE_INFOPLIST_FILE.
    #
    # INFOPLIST_KEY_* only works for keys Xcode has an allowlist entry for.
    # NSAlarmKitUsageDescription is new in iOS 26 and was silently dropped: no build
    # warning, no crash at runtime, just an authorization request that fails and a
    # permission dialog that never appears. Exactly what happened on device.
    info:
      path: ios/Lockin/Info.plist
      properties:
        CFBundleDisplayName: Nagg
        # Reference the build settings, never a number. A literal in here wins over
        # `xcodebuild CURRENT_PROJECT_VERSION=...`, so the run number silently stopped
        # reaching the binary the day this file became a real Info.plist -- and the only
        # symptom was "Redundant Binary Upload" from Apple, one upload too late.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSAlarmKitUsageDescription: "Nagg schedules alarms for the commitments you create. For example, a commitment set for 7pm rings through Silent mode and Focus until you prove you started."
        NSCameraUsageDescription: "Nagg uses the camera to photograph your workspace as proof that you started your task. For example, when your alarm for \"Write the essay intro\" rings, you photograph your open notebook and the alarm stops."
        # The camera picker falls back to the photo library when no camera is
        # available. Reaching that path without this key is an immediate,
        # unexplained termination by the system rather than a warning.
        NSPhotoLibraryUsageDescription: "Nagg can use a photo from your library as proof that you started, for example a picture of your desk, when the camera is unavailable."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: ios/Lockin/Lockin.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.r00tlab.lockin

  # ── Apple Watch app ──────────────────────────────────────────────────────────
  LockinWatch:
    type: application
    platform: watchOS
    sources:
      - path: ios/LockinWatch
        # Widget/ belongs to the complication target below. Without this exclude the
        # same file lands in two targets and the build fails on duplicate symbols.
        excludes:
          - "Widget/**"
      - path: ios/Lockin/Models/Commitment.swift
      - path: ios/Lockin/Models/WatchSyncPayload.swift
    dependencies:
      - target: LockinWatchWidget
        embed: true
    settings:
      base:
        # Apple requires exactly this suffix for a companion watch app. Any other
        # value and the watch app will not install alongside the phone app.
        PRODUCT_BUNDLE_IDENTIFIER: com.r00tlab.lockin.watchkitapp
        PRODUCT_NAME: Lockin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nagg
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.r00tlab.lockin
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_WKApplication: YES
        TARGETED_DEVICE_FAMILY: "4"
        # Its own catalog, not the phone's. A single appiconset declaring both ios and
        # watchos platforms does not satisfy either validator.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: ios/LockinWatch/LockinWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.r00tlab.lockin

  # ── Watch complication ───────────────────────────────────────────────────────
  LockinWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: ios/LockinWatch/Widget
      - path: ios/Lockin/Models/Commitment.swift
      - path: ios/Lockin/Models/WatchSyncPayload.swift
      # The complication reads its data straight from the App Group cache rather than
      # waking the watch app, so it needs the cache type compiled into its own target.
      - path: ios/LockinWatch/Services/WatchSnapshotCache.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r00tlab.lockin.watchkitapp.widget
        PRODUCT_NAME: LockinWatchWidget
        TARGETED_DEVICE_FAMILY: "4"
    # This block is what was missing when the watch was pulled. Same reason as the
    # phone widget: NSExtensionPointIdentifier has to sit inside NSExtension, and
    # INFOPLIST_KEY_* cannot nest.
    # Deliberately outside ios/LockinWatch/: that directory is the watch *app's* source
    # root, and a plist sitting inside it ends up merged into the app's own Info.plist.
    # The first build of this fix shipped a watch application declaring NSExtension,
    # which is invalid for an app bundle and is exactly the kind of malformed bundle
    # that made 17 and 18 refuse to install.
    info:
      path: ios/LockinWatchWidget-Info.plist
      properties:
        CFBundleDisplayName: Nagg
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ── Live Activity / Dynamic Island ───────────────────────────────────────────
  LockinWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/LockinWidget
      # Shared with the app. XcodeGen handles multi-target membership by listing the
      # same path twice — this is the thing SETUP.md warns you to get right by hand.
      - path: ios/Lockin/Models/Commitment.swift
      - path: ios/Lockin/Models/LockinMetadata.swift
      - path: ios/Lockin/Intents/ProofIntent.swift
      # The Live Activity is the alarm as far as the Lock Screen is concerned, and it is
      # what ends up in every screen recording. It has to be the same red as the app.
      - path: ios/Lockin/Design/NaggStyle.swift
      # ProofIntent runs in *this* process, not the app's, so its logging has to come
      # with it. Without this the widget target does not compile.
      - path: ios/Lockin/Services/NaggLog.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r00tlab.lockin.widget
        PRODUCT_NAME: LockinWidget
    # A real Info.plist, not GENERATE_INFOPLIST_FILE. Apple requires
    # NSExtensionPointIdentifier *inside* the NSExtension dictionary, and
    # INFOPLIST_KEY_* settings can only write flat top-level keys — the build succeeds
    # and the upload is rejected with error 90348.
    info:
      path: ios/LockinWidget/Info.plist
      properties:
        CFBundleDisplayName: Nagg
        # Same for the extension: an app whose widget disagrees about the build number
        # is rejected at upload, not at review.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ios/LockinWidget/LockinWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.r00tlab.lockin

  # ── Logic tests ──────────────────────────────────────────────────────────────
  #
  # Deliberately NOT a host-app test bundle, and deliberately not `@testable import
  # Lockin`. Doing it that way would drag AlarmKit and RevenueCat into every test run,
  # and then a test failure could mean a framework that does not load in a simulator
  # rather than a bug in our code — which is the opposite of what a test is for.
  #
  # Instead the model file is compiled straight into the bundle, the same multi-target
  # trick the widget uses. Everything worth testing here is pure date arithmetic.
  LockinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/LockinTests
      - path: ios/Lockin/Models/Commitment.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r00tlab.lockin.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lockin:
    build:
      targets:
        Lockin: all
        LockinTests: [test]
    test:
      config: Debug
      targets:
        - LockinTests
    archive:
      config: Release
