# XcodeGen spec — the whole Xcode project, as text.
#
# Why this file exists: you do not own a Mac. An .xcodeproj is a fragile binary-ish
# bundle that has to be authored in Xcode. This YAML replaces it. You edit it on
# Windows, commit, and the macOS runner runs `xcodegen generate` to produce a real
# .xcodeproj before building. Never commit the generated .xcodeproj.
#
# Team ID is hardcoded rather than read from a secret. It is not sensitive — it ships
# inside every IPA — and hardcoding removes one more thing that can be silently missing
# when a build fails on a machine you cannot see.

name: Lockin

options:
  bundleIdPrefix: com.r00tlab
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: VFYZFK5NL3
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # iPhone only — see LAUNCH.md for why supporting iPad costs screenshots, review
    # surface, and testing time.
    TARGETED_DEVICE_FAMILY: "1"

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:

  # The watch targets are deliberately absent. Builds 17 and 18 uploaded, validated,
  # showed as Testing, and would not install on a device — and every candidate cause in
  # the watch bundle was a guess costing a ten-minute round trip. Apple Watch was never
  # in the v1 scope (see PRODUCT.md); it is not worth blocking the one question that
  # matters, which is whether the alarm rings through Silent mode.
  #
  # ios/LockinWatch/ is still in the repo. Re-add these targets once the alarm is proven
  # on a real phone, and debug the install failure with something to lose.

  # ── iPhone app ───────────────────────────────────────────────────────────────
  Lockin:
    type: application
    platform: iOS
    sources:
      - path: ios/Lockin
    dependencies:
      - target: LockinWidget
        embed: true
      - package: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r00tlab.lockin
        # Internal target/bundle names stay "Lockin" — the App Store name was taken and
        # renaming internals would invalidate the registered identifiers for nothing.
        # Only CFBundleDisplayName reaches the user's home screen.
        PRODUCT_NAME: Lockin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nagg
        # Missing this key does not warn — it crashes the app the moment it asks for
        # alarm permission. See SETUP.md section 5.
        INFOPLIST_KEY_NSAlarmKitUsageDescription: "Nagg needs alarm access so your commitments ring through Silent and Focus."
        INFOPLIST_KEY_NSCameraUsageDescription: "Nagg uses the camera so you can prove you actually started."
        # Answers the export-compliance question once, in the build, instead of by hand
        # in App Store Connect on every single upload. False is the truthful answer:
        # Nagg ships no cryptography of its own, and RevenueCat's HTTPS goes through
        # URLSession — that is Apple's own OS encryption, which is exempt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Portrait for iPhone, all four for iPad. Apple validates the iPad set even on
        # an iPhone-only app and rejects the bundle if it is not complete — declaring
        # both is cheaper than arguing with the validator.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
        # App Store upload is rejected outright without an icon — the failure arrives
        # from Transporter after a successful archive, which makes it look like an
        # upload problem rather than a missing asset. Placeholder for now; replace the
        # 1024px PNG before the store listing goes live.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # App Group entitlement removed as a bisection step, not as a design change.
    # Builds 17-20 all uploaded, validated, showed as Testing, and refused to install.
    # An entitlement the provisioning profile does not carry fails exactly that way:
    # Apple's upload check ignores it, the device rejects it.
    #
    # The code degrades rather than breaks -- UserDefaults(suiteName:) falls back to
    # .standard and the store falls back to the documents directory -- so the alarm can
    # still be tested. Restore this once the install is proven, with the App ID's
    # App Groups capability confirmed as assigned in the portal, not merely ticked.

  # ── Live Activity / Dynamic Island ───────────────────────────────────────────
  LockinWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/LockinWidget
      # Shared with the app. XcodeGen handles multi-target membership by listing the
      # same path twice — this is the thing SETUP.md warns you to get right by hand.
      - path: ios/Lockin/Models/Commitment.swift
      - path: ios/Lockin/Models/LockinMetadata.swift
      - path: ios/Lockin/Intents/ProofIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r00tlab.lockin.widget
        PRODUCT_NAME: LockinWidget
    # A real Info.plist, not GENERATE_INFOPLIST_FILE. Apple requires
    # NSExtensionPointIdentifier *inside* the NSExtension dictionary, and
    # INFOPLIST_KEY_* settings can only write flat top-level keys — the build succeeds
    # and the upload is rejected with error 90348.
    info:
      path: ios/LockinWidget/Info.plist
      properties:
        CFBundleDisplayName: Nagg
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Lockin:
    build:
      targets:
        Lockin: all
    archive:
      config: Release
